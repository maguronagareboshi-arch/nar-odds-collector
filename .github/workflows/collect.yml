# 当日オッズ(単複+全券種)を取る。朝 10 時ごろ〜発走 40 分前は 30 分おきに単複だけ(morning)・発走 40〜10 分前は 2 分おき(far)・発走 10 分前〜8 分後は 1 分おき(hot)の 3 本を同じジョブで並走。1 ジョブが最長 6 時間なので、昼の便(〜16:00)と夜の便(〜22:00)に分けて JST 10:00〜22:00 を覆う。
# 公開リポジトリなので Actions の分数は無制限。手動実行は until(JST HHMM)を指定できる。
# Secrets: SUPABASE_URL / SUPABASE_SERVICE_KEY(任意: COLLECTOR_UA)
name: collect
# 起動の保険: GitHub の schedule は遅れたり抜けたりするので、JST 09:58〜21:58 の 20 分おきに全部起こす。
# 同時に走るのは 1 本だけ(走行中なら後続は 1 本だけ待機し、前の便が終わった時点で後を継ぐ。
# 終了時刻を過ぎていれば loop.py がすぐ終わる)。→ どれか 1 本でも起きればループが続く。
# 走行機ごと弾かれたとき(2026-09-23 16:11〜17:28: 1 台にだけ keiba.go.jp が全ページ 404)は、loop.py が 3 分で
# 気づいて 3 車線そろって抜ける(rc 75)→ 下の「hand off」が次の便を起こし、別の走行機が継ぐ。
# 走行機が固まって抜けられないときは、本番 DB の見張りが rescue.yml を起こして外から取り消す。
on:
  schedule:
    - cron: '58 0-12 * * *'   # JST 09:58, 10:58, ... 21:58
    - cron: '18 1-12 * * *'   # JST 10:18, ... 21:18
    - cron: '38 1-12 * * *'   # JST 10:38, ... 21:38
  workflow_dispatch:
    inputs:
      until:
        description: 'JST HHMM until (empty: 1600 before 15:30, else 2200)'
        required: false
        default: ''
concurrency:
  group: collect
  cancel-in-progress: false
permissions:
  contents: read
  actions: write   # 走行機ごと弾かれたとき、次の便を自分で起こす(gh workflow run)
jobs:
  odds:
    runs-on: ubuntu-latest
    timeout-minutes: 365
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: "loop (morning every 30 min / far every 2 min / hot every 1 min)"
        id: loop
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          COLLECTOR_UA: ${{ secrets.COLLECTOR_UA }}
          NAR_RESEARCH_ARCHIVE_DIR: research-preoff
          UNTIL_IN: ${{ github.event.inputs.until }}
        run: |
          H=$(TZ=Asia/Tokyo date +%H%M)
          if [ -n "$UNTIL_IN" ]; then U="$UNTIL_IN"; elif [ $((10#$H)) -lt 1530 ]; then U=1600; else U=2200; fi
          echo "JST $H -> $U"
          rm -f .runner-blocked
          python loop.py --until "$U" --lane morning &
          M=$!
          python loop.py --until "$U" --lane far &
          F=$!
          python loop.py --until "$U" --lane hot &
          T=$!
          # 3 本とも待つ。75= 走行機ごと弾かれたので抜けた(失敗にしない= 下で次の便を起こす)
          rc=0
          for p in "$M" "$F" "$T"; do
            wait "$p" || { s=$?; [ "$s" -eq 75 ] || rc=$s; }
          done
          if [ -f .runner-blocked ]; then
            echo "blocked=1" >> "$GITHUB_OUTPUT"
            echo "::warning::keiba.go.jp がこの走行機を弾いた($(cat .runner-blocked))。次の便に渡す"
          fi
          exit "$rc"
      - name: hand off to a fresh runner
        if: steps.loop.outputs.blocked == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 同じ列(concurrency collect)の後ろに 1 本積む= このジョブが終わるとすぐ別の走行機で走る
          gh workflow run collect.yml -R "${{ github.repository }}" --ref "${{ github.ref_name }}"
      - name: retain preoff research inputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nar-preoff-${{ github.run_id }}-${{ github.run_attempt }}
          path: research-preoff/
          retention-days: 14
          if-no-files-found: ignore
