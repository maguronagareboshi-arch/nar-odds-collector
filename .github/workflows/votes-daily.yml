# §238c 票数の毎日便。2022-11 以降の票数は公式 ZIP に無いので、前日ぶんだけ取得元の払戻の日ページから取る。
# ⛔書くのは nar_race_votes だけ(払戻・成績は公式があるので上書きしない)。
# ⛔1 日 1 場 1 ページ・1 秒 1 ページ・並列なし。実測= 4 場の日で カレンダー込み 5 ページ・4 秒。
# cron 20:40 UTC = 05:40 JST(前日の結果が出そろってから)。何度流しても行は増えない(upsert)。
# Secrets: SUPABASE_URL / SUPABASE_SERVICE_KEY(任意: COLLECTOR_UA / COLLECTOR_CONTACT)
name: votes-daily
on:
  schedule:
    - cron: '40 20 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'YYYY-MM-DD (empty - yesterday in JST)'
        required: false
        default: ''
      dry:
        description: 'dry run (no writes)'
        required: false
        default: 'false'
permissions:
  contents: read
concurrency:
  group: votes-daily
  cancel-in-progress: false
jobs:
  votes:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: "collect yesterday votes - 1 page per second"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          COLLECTOR_UA: ${{ secrets.COLLECTOR_UA }}
          COLLECTOR_CONTACT: ${{ secrets.COLLECTOR_CONTACT }}
          DATE: ${{ github.event.inputs.date }}
          DRY: ${{ github.event.inputs.dry }}
        run: |
          D="$DATE"
          if [ -z "$D" ]; then D=$(TZ=Asia/Tokyo date -d yesterday +%F); fi
          args="--date $D --votes-only --max-seconds 1200"
          if [ "$DRY" = "true" ]; then args="$args --dry"; fi
          python rakuten_backfill.py $args
